[package]
name = "codeagent"
version = "0.1.0"
edition = "2021"
description = "Local code agent — gpt-oss brain via llama.cpp, Harmony rendered in Rust (Stack A)"

[[bin]]
name = "codeagent"
path = "src/main.rs"

[dependencies]
# The official Harmony renderer/parser (Rust is the core; Python is bindings).
# Published as a git crate per the openai/harmony README.
openai-harmony = { git = "https://github.com/openai/harmony" }

reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
anyhow = "1"

# In-process search (Stack A: no subprocess). `ignore` respects .gitignore.
ignore = "0.4"
globset = "0.4"
regex = "1"

[profile.release]
opt-level = 3
lto = true
