<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 524" width="364" height="524"
     font-family="Helvetica, Arial, sans-serif">
  <style>
    .bx{fill:#fff;stroke:#111;stroke-width:1.2}
    .bxn{fill:#ececec;stroke:#111;stroke-width:1.2}
    .proc{fill:#fff;stroke:#111;stroke-width:2.4}
    .t{font-size:11.5px;fill:#111}
    .tb{font-size:12px;fill:#111;font-weight:bold}
    .ts{font-size:9.5px;fill:#333}
    .cap{font-size:10px;fill:#444;font-style:italic}
    .ar{stroke:#111;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .ard{stroke:#777;stroke-width:1;fill:none;stroke-dasharray:3 2.5;marker-end:url(#ag)}
    .host{fill:none;stroke:#111;stroke-width:1.1;stroke-dasharray:6 4}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>

  <text x="8" y="14" class="cap">single host · no cloud service · no network egress</text>
  <rect x="6" y="20" width="352" height="496" class="host" rx="4"/>

  <rect x="42" y="32" width="276" height="28" class="bx" rx="2"/>
  <text x="180" y="50" class="t" text-anchor="middle">Terminal UI  ·  permission prompts</text>

  <rect x="42" y="72" width="276" height="42" class="bx" rx="2"/>
  <text x="180" y="89" class="tb" text-anchor="middle">Turn state machine</text>
  <text x="180" y="105" class="ts" text-anchor="middle">recovery policies · context budget · compaction</text>

  <rect x="42" y="130" width="130" height="36" class="bxn" rx="2"/>
  <text x="107" y="146" class="tb" text-anchor="middle">Decoding strategy</text>
  <text x="107" y="159" class="ts" text-anchor="middle">unconstrained | global | CSCD</text>

  <rect x="42" y="176" width="130" height="36" class="bx" rx="2"/>
  <text x="107" y="192" class="t" text-anchor="middle">Harmony codec</text>
  <text x="107" y="205" class="ts" text-anchor="middle">render / parse / recognize</text>

  <rect x="42" y="222" width="130" height="30" class="bx" rx="2"/>
  <text x="107" y="241" class="t" text-anchor="middle">Inference client</text>

  <rect x="188" y="130" width="130" height="82" class="bx" rx="2"/>
  <text x="253" y="146" class="tb" text-anchor="middle">Tool registry</text>
  <text x="253" y="163" class="ts" text-anchor="middle">navigate: list_dir, glob,</text>
  <text x="253" y="175" class="ts" text-anchor="middle">grep, read</text>
  <text x="253" y="190" class="ts" text-anchor="middle">execute: bash</text>
  <text x="253" y="205" class="ts" text-anchor="middle">write: edit, write, multi_edit</text>

  <rect x="188" y="222" width="130" height="30" class="bxn" rx="2"/>
  <text x="253" y="235" class="tb" text-anchor="middle">Permission engine</text>
  <text x="253" y="247" class="ts" text-anchor="middle">modes · rules · fail-closed</text>

  <rect x="42" y="272" width="130" height="46" class="proc" rx="2"/>
  <text x="107" y="290" class="t" text-anchor="middle">llama-server</text>
  <text x="107" y="304" class="ts" text-anchor="middle">gpt-oss-20b, MXFP4</text>

  <rect x="188" y="272" width="130" height="46" class="proc" rx="2"/>
  <text x="253" y="285" class="tb" text-anchor="middle">Capability profile</text>
  <text x="253" y="298" class="ts" text-anchor="middle">ro outside root · no net</text>
  <text x="253" y="311" class="ts" text-anchor="middle">(bubblewrap)</text>

  <rect x="112" y="340" width="136" height="28" class="bx" rx="2"/>
  <text x="180" y="358" class="t" text-anchor="middle">project working tree</text>

  <rect x="42" y="396" width="276" height="44" class="bxn" rx="2"/>
  <text x="180" y="413" class="tb" text-anchor="middle">Instrumentation</text>
  <text x="180" y="430" class="ts" text-anchor="middle">evidence ledger · JSONL trace · run manifest · seed</text>

  <path d="M180,60 L180,70" class="ar"/>
  <path d="M120,114 L110,128" class="ar"/>
  <path d="M240,114 L250,128" class="ar"/>
  <path d="M107,166 L107,174" class="ar"/>
  <path d="M107,212 L107,220" class="ar"/>
  <path d="M107,252 L107,270" class="ar"/>
  <path d="M253,212 L253,220" class="ar"/>
  <path d="M253,252 L253,270" class="ar"/>
  <path d="M253,318 L220,338" class="ar"/>
  <path d="M107,318 L107,330 L160,330" class="ar"/>
  <text x="112" y="327" class="ts">token IDs in / out</text>

  <path d="M70,440 L70,462 L180,462" class="ard"/>
  <path d="M290,440 L290,462 L186,462" class="ard"/>
  <text x="180" y="478" class="cap" text-anchor="middle">every event, decision and observation is recorded</text>
</svg>
