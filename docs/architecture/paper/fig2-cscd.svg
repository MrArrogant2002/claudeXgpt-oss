<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240"
     font-family="Helvetica, Arial, sans-serif">
  <style>
    .free{fill:#fff;stroke:#111;stroke-width:1.2}
    .con{fill:#e2e2e2;stroke:#111;stroke-width:1.2}
    .inj{fill:#9f9f9f;stroke:#111;stroke-width:1.2}
    .tok{font-size:10px;fill:#111;font-family:"Courier New",monospace}
    .tokw{font-size:10px;fill:#fff;font-family:"Courier New",monospace}
    .ph{font-size:12px;fill:#111;font-weight:bold}
    .sub{font-size:10px;fill:#333}
    .note{font-size:10px;fill:#111}
    .cap{font-size:10px;fill:#444;font-style:italic}
    .num{font-size:10px;fill:#111;font-weight:bold}
    .dash{stroke:#111;stroke-width:1.1;stroke-dasharray:4 3;fill:none}
    .cir{fill:#fff;stroke:#111;stroke-width:1.2}
  </style>

  <rect x="556" y="7" width="12" height="9" class="inj"/>
  <text x="574" y="15" class="cap">emitted by the orchestrator, not the model</text>

  <text x="268" y="15" class="cap" text-anchor="middle">commentary-channel onset detected</text>
  <path d="M300,19 L300,62" class="dash"/>

  <text x="175" y="40" class="ph" text-anchor="middle">Phase A</text>
  <text x="175" y="54" class="sub" text-anchor="middle">unconstrained decode</text>
  <text x="334" y="40" class="ph" text-anchor="middle">B</text>
  <text x="334" y="54" class="sub" text-anchor="middle">tool name</text>
  <text x="449" y="40" class="ph" text-anchor="middle">B&#8242;</text>
  <text x="449" y="54" class="sub" text-anchor="middle">header injected</text>
  <text x="587" y="40" class="ph" text-anchor="middle">Phase C</text>
  <text x="587" y="54" class="sub" text-anchor="middle">schema-constrained</text>

  <text x="44" y="94" class="sub" text-anchor="end">tokens</text>
  <rect x="50" y="66" width="250" height="48" class="free"/>
  <text x="175" y="86" class="tok" text-anchor="middle">&lt;|channel|&gt;analysis&lt;|message|&gt;</text>
  <text x="175" y="102" class="tok" text-anchor="middle">… free-form reasoning …</text>

  <rect x="300" y="66" width="68" height="48" class="con"/>
  <text x="334" y="94" class="tok" text-anchor="middle">read</text>

  <rect x="368" y="66" width="162" height="48" class="inj"/>
  <text x="449" y="86" class="tokw" text-anchor="middle">to=functions.read</text>
  <text x="449" y="102" class="tokw" text-anchor="middle">&lt;|constrain|&gt;json&lt;|message|&gt;</text>

  <rect x="530" y="66" width="115" height="48" class="con"/>
  <text x="587" y="94" class="tok" text-anchor="middle">{"path":"loop.py"}</text>

  <rect x="645" y="66" width="45" height="48" class="con"/>
  <text x="667" y="94" class="tok" text-anchor="middle">&lt;|call|&gt;</text>

  <circle cx="175" cy="130" r="7.5" class="cir"/><text x="175" y="134" class="num" text-anchor="middle">1</text>
  <circle cx="300" cy="130" r="7.5" class="cir"/><text x="300" y="134" class="num" text-anchor="middle">2</text>
  <circle cx="587" cy="130" r="7.5" class="cir"/><text x="587" y="134" class="num" text-anchor="middle">3</text>

  <text x="44" y="161" class="sub" text-anchor="end">grammar</text>
  <rect x="50" y="146" width="250" height="22" class="free"/>
  <text x="175" y="161" class="note" text-anchor="middle">INACTIVE</text>
  <rect x="300" y="146" width="390" height="22" class="con"/>
  <text x="495" y="161" class="note" text-anchor="middle">ACTIVE</text>

  <text x="50" y="196" class="note">1  The reasoning channel is</text>
  <text x="50" y="210" class="note">never constrained, so there is</text>
  <text x="50" y="224" class="note">no constraint tax on reasoning.</text>

  <text x="265" y="196" class="note">2  The grammar starts only after</text>
  <text x="265" y="210" class="note">the model has committed to a call,</text>
  <text x="265" y="224" class="note">so call suppression cannot occur.</text>

  <text x="490" y="196" class="note">3  Arguments are checked against</text>
  <text x="490" y="210" class="note">that one tool&#8217;s schema, so invalid</text>
  <text x="490" y="224" class="note">parameter names cannot be emitted.</text>
</svg>
